<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI视觉布控优化系统</title>

    <!-- Tailwind Play CDN 必须先加载 -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- FontAwesome 图标（AI 双模态布控等页面使用） -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

    <!-- 统一深色色板 token（必须在 CDN 之后设置，否则会被 CDN 覆盖丢失） -->
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              bg: '#0a0e1a',        // 页面底
              surface: '#121829',   // 卡片/面板
              surface2: '#1a2136',  // 页眉条/表头/输入底/升起层
              edge: '#262e45',      // 边框/分隔线
              ink: '#e6e9f2',       // 主文字
              muted: '#8a92a8',     // 次级文字/占位
              accent: '#4f6bff',    // 主强调(蓝)
              accent2: '#8b5cf6',   // 次强调(紫)
            },
            borderColor: { DEFAULT: '#262e45' }, // 裸 border 默认用 edge 色
          },
        },
      };
    </script>

    <!-- 可复用组件类：改一处即全站生效 -->
    <style type="text/tailwindcss">
      @layer base {
        body {
          @apply bg-bg text-ink;
          font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }
        /* 表单控件深色兜底：许多输入未显式设背景/文字色，避免深色下黑字不可见 */
        input:not([type="checkbox"]):not([type="radio"]):not([type="range"]),
        select,
        textarea {
          @apply bg-surface2 text-ink border-edge;
        }
        option { @apply bg-surface text-ink; }
      }
      @layer components {
        .card { @apply bg-surface border border-edge rounded-xl; }
        .card-header { @apply px-6 py-4 border-b border-edge bg-surface2; }
        .card-footer { @apply px-6 py-4 border-t border-edge bg-surface2; }

        .btn-primary {
          @apply inline-flex items-center justify-center bg-gradient-to-r from-accent to-accent2
                 text-white rounded-lg font-medium shadow-lg shadow-accent/20
                 transition-all hover:brightness-110 active:scale-95;
        }
        .btn-ghost {
          @apply inline-flex items-center justify-center border border-edge text-muted rounded-lg
                 font-medium transition-colors hover:bg-surface2 hover:text-ink;
        }

        .input, .select {
          @apply bg-surface2 border border-edge rounded-lg text-ink placeholder-muted
                 outline-none focus:ring-2 focus:ring-accent focus:border-accent transition-colors;
        }

        .th { @apply text-xs font-semibold text-muted uppercase tracking-wider; }

        /* 状态徽标：深色底半透明 */
        .pill { @apply inline-flex items-center px-2.5 py-1 rounded-full text-xs font-medium border; }
        .pill-green { @apply bg-emerald-500/15 text-emerald-300 border-emerald-500/25; }
        .pill-red   { @apply bg-red-500/15 text-red-300 border-red-500/25; }
        .pill-amber { @apply bg-amber-500/15 text-amber-300 border-amber-500/25; }
        .pill-blue  { @apply bg-accent/15 text-blue-300 border-accent/30; }
        .pill-purple{ @apply bg-accent2/15 text-purple-300 border-accent2/30; }
        .pill-slate { @apply bg-slate-500/15 text-slate-300 border-slate-500/25; }
      }
    </style>

    <!-- 深色自定义滚动条 -->
    <style>
      ::-webkit-scrollbar { width: 10px; height: 10px; }
      ::-webkit-scrollbar-track { background: #0a0e1a; }
      ::-webkit-scrollbar-thumb { background: #2b3450; border-radius: 6px; border: 2px solid #0a0e1a; }
      ::-webkit-scrollbar-thumb:hover { background: #3a466b; }
      * { scrollbar-color: #2b3450 #0a0e1a; scrollbar-width: thin; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
