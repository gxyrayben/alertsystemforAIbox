<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>安防综合管理平台</title>
    
    <!-- 引入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- 引入 React 和 ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- 引入 Babel 转换 JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- 引入 Lucide 图标库 -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        /* 加载动画样式 */
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-25%); }
        }
        .animate-bounce-dot {
            animation: bounce 1s infinite;
        }
        .animate-spin-slow {
            animation: spin 2s linear infinite;
        }
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // --- 图标组件 (手动实现简单的 SVG) ---
        const Icon = ({ name, className }) => {
            const icons = {
                Server: '<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="8" rx="2" ry="2"></rect><rect x="2" y="14" width="20" height="8" rx="2" ry="2"></rect><line x1="6" y1="6" x2="6.01" y2="6"></line><line x1="6" y1="18" x2="6.01" y2="18"></line></svg>',
                AlertTriangle: '<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path><line x1="12" y1="9" x2="12" y2="13"></line><line x1="12" y1="17" x2="12.01" y2="17"></line></svg>',
                MessageSquare: '<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>',
                Activity: '<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline></svg>',
                Settings: '<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>',
                Network: '<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="16" y="16" width="6" height="6" rx="1"></rect><rect x="2" y="16" width="6" height="6" rx="1"></rect><rect x="9" y="2" width="6" height="6" rx="1"></rect><path d="M5 16v-3a1 1 0 0 1 1-1h12a1 1 0 0 1 1 1v3"></path><path d="M12 12V8"></path></svg>',
                Plus: '<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>',
                Edit: '<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>',
                Trash2: '<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path><line x1="10" y1="11" x2="10" y2="17"></line><line x1="14" y1="11" x2="14" y2="17"></line></svg>',
                X: '<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>',
                ChevronLeft: '<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>',
                ChevronRight: '<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>',
                Search: '<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>',
                RefreshCcw: '<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="1 4 1 10 7 10"></polyline><polyline points="23 20 23 14 17 14"></polyline><path d="M20.49 9A9 9 0 0 0 5.64 5.64L1 10m22 4l-4.64 4.36A9 9 0 0 1 3.51 15"></path></svg>',
                Camera: '<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path><circle cx="12" cy="13" r="4"></circle></svg>',
                Clock: '<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>',
                Sparkles: '<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v3m0 12v3m9-9h-3M6 12H3m13.414-4.243l-2.121 2.121m-6.364 6.364l-2.121 2.121m10.607 0l-2.121-2.121M6.343 7.757l2.121 2.121"></path></svg>',
                Send: '<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>',
                User: '<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>',
                Bot: '<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="10" rx="2"></rect><circle cx="12" cy="5" r="2"></circle><path d="M12 7v4"></path><line x1="8" y1="16" x2="8.01" y2="16"></line><line x1="16" y1="16" x2="16.01" y2="16"></line></svg>',
                Loader2: '<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="2" x2="12" y2="6"></line><line x1="12" y1="18" x2="12" y2="22"></line><line x1="4.93" y1="4.93" x2="7.76" y2="7.76"></line><line x1="16.24" y1="16.24" x2="19.07" y2="19.07"></line><line x1="2" y1="12" x2="6" y2="12"></line><line x1="18" y1="12" x2="22" y2="12"></line><line x1="4.93" y1="19.07" x2="7.76" y2="16.24"></line><line x1="16.24" y1="7.76" x2="19.07" y2="4.93"></line></svg>'
            };
            return (
                <span 
                    className={`inline-block ${className || ''}`} 
                    dangerouslySetInnerHTML={{ __html: icons[name] || '' }} 
                />
            );
        };

        // --- 模拟数据生成器 ---
        const generateMockDevices = () => {
            const statuses = ['在线', '离线', '异常'];
            return Array.from({ length: 22 }, (_, i) => ({
                id: `dev-${i + 1}`,
                name: `视频监控设备 ${i + 1}号`,
                ip: `192.168.1.${10 + i}`,
                port: '8080',
                username: 'admin',
                password: 'password123',
                status: statuses[Math.floor(Math.random() * statuses.length)],
            }));
        };

        const alertTypes = ['区域入侵', '越界检测', '车辆违停', '人员聚集', '烟火检测'];
        const generateMockAlerts = () => {
            return Array.from({ length: 16 }, (_, i) => {
                const date = new Date(Date.now() - Math.floor(Math.random() * 10000000000));
                return {
                    id: `alert-${i + 1}`,
                    deviceName: `视频监控设备 ${Math.floor(Math.random() * 20) + 1}号`,
                    alertType: alertTypes[Math.floor(Math.random() * alertTypes.length)],
                    time: date.toLocaleString('zh-CN', { hour12: false }),
                    timestamp: date.getTime(),
                    imageUrl: null,
                    remark: '暂无备注',
                };
            }).sort((a, b) => b.timestamp - a.timestamp);
        };

        const mockNetworkInterfaces = [
            { id: 'eth0', name: 'eth0 (默认物理网卡)', ip: '192.168.1.100', mac: '00:1B:44:11:3A:B7', status: 'connected' },
            { id: 'eth1', name: 'eth1 (内网数据网卡)', ip: '10.0.0.5', mac: '00:1B:44:11:3A:B8', status: 'connected' },
            { id: 'wlan0', name: 'wlan0 (无线网络)', ip: '192.168.0.50', mac: 'A4:C3:F0:99:81:22', status: 'disconnected' },
            { id: 'docker0', name: 'docker0 (虚拟网桥)', ip: '172.17.0.1', mac: '02:42:0E:1B:54:11', status: 'connected' }
        ];

        // --- 主应用组件 ---
        function App() {
            // 全局状态
            const [activeMenu, setActiveMenu] = useState('alerts'); // 默认选中预警管理预览
            const itemsPerPage = 15;

            // 设备管理状态
            const [devices, setDevices] = useState(generateMockDevices());
            const [isDeviceModalOpen, setIsDeviceModalOpen] = useState(false);
            const [editingDeviceId, setEditingDeviceId] = useState(null);
            const [deviceFormData, setDeviceFormData] = useState({ name: '', ip: '', port: '', username: '', password: '' });
            const [devicePage, setDevicePage] = useState(1);

            // 预警管理状态
            const [allAlerts, setAllAlerts] = useState(generateMockAlerts());
            const [displayedAlerts, setDisplayedAlerts] = useState([]);
            const [alertFilters, setAlertFilters] = useState({ startDate: '', endDate: '', deviceName: '', alertType: '' });
            const [aiLoadingIds, setAiLoadingIds] = useState({});

            // 会话管理状态
            const [chatMessages, setChatMessages] = useState([
                { role: 'model', text: '您好！我是安防综合管理平台的专属 AI 助手。您可以向我询问关于设备接入配置、预警处理规范或日常安防管理建议。有什么我可以帮您的吗？' }
            ]);
            const [chatInput, setChatInput] = useState('');
            const [isChatLoading, setIsChatLoading] = useState(false);
            const chatScrollRef = useRef(null);

            // 服务管理状态 (新增)
            const [servicesConfig, setServicesConfig] = useState({
                ws: { enabled: true, port: '8080', path: '/api/ws/alarms' },
                http: { enabled: true, port: '80', path: '/api/http/alarms' }
            });

            // 网络管理状态 (新增)
            const [selectedNetworkId, setSelectedNetworkId] = useState('eth0');
            const selectedNetwork = mockNetworkInterfaces.find(n => n.id === selectedNetworkId);

            // 初始化预警数据
            useEffect(() => { handleSearchAlerts(); }, []);

            // 聊天自动滚动
            useEffect(() => {
                if (chatScrollRef.current) {
                    chatScrollRef.current.scrollTop = chatScrollRef.current.scrollHeight;
                }
            }, [chatMessages, isChatLoading]);

            // --- 服务管理逻辑 (新增) ---
            const handleServiceConfigChange = (type, field, value) => {
                setServicesConfig(prev => ({
                    ...prev,
                    [type]: {
                        ...prev[type],
                        [field]: value
                    }
                }));
            };

            const saveServiceConfig = (type) => {
                // 这里通常会向后端发送API请求保存配置
                alert(`${type.toUpperCase()} 服务配置已保存`);
            };

            // --- 预警管理逻辑 ---
            const handleAlertFilterChange = (e) => setAlertFilters(prev => ({ ...prev, [e.target.name]: e.target.value }));
            
            const handleSearchAlerts = () => {
                let filtered = [...allAlerts];
                if (alertFilters.deviceName) filtered = filtered.filter(a => a.deviceName.includes(alertFilters.deviceName));
                if (alertFilters.alertType) filtered = filtered.filter(a => a.alertType === alertFilters.alertType);
                if (alertFilters.startDate) {
                    const startTimestamp = new Date(alertFilters.startDate).getTime();
                    filtered = filtered.filter(a => a.timestamp >= startTimestamp);
                }
                if (alertFilters.endDate) {
                    const endTimestamp = new Date(alertFilters.endDate).setHours(23, 59, 59, 999);
                    filtered = filtered.filter(a => a.timestamp <= endTimestamp);
                }
                setDisplayedAlerts(filtered);
            };

            const handleResetAlertFilters = () => {
                setAlertFilters({ startDate: '', endDate: '', deviceName: '', alertType: '' });
                setDisplayedAlerts([...allAlerts]);
            };

            const handleAIAnalysis = async (alertData) => {
                setAiLoadingIds(prev => ({ ...prev, [alertData.id]: true }));
                try {
                    const apiKey = ""; // 填入您的 API Key (如果在本地运行需要)
                    const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`;
                    
                    const prompt = `你是一个专业的安防监控AI助手。请根据以下预警信息，生成一段简短的备注说明和后续处理建议（总共不要超过50个字）。\n设备名称：${alertData.deviceName}\n告警类型：${alertData.alertType}\n发生时间：${alertData.time}`;

                    const response = await fetch(url, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
                    });
                    
                    if (!response.ok) throw new Error('API Request Failed');
                    
                    const data = await response.json();
                    const aiText = data.candidates?.[0]?.content?.parts?.[0]?.text || "分析失败。";

                    setAllAlerts(prev => prev.map(a => a.id === alertData.id ? { ...a, remark: aiText } : a));
                    setDisplayedAlerts(prev => prev.map(a => a.id === alertData.id ? { ...a, remark: aiText } : a));
                } catch (error) {
                    console.error(error);
                    // 模拟本地回显 (为了离线演示)
                    const fakeMsg = `AI建议：已确认${alertData.alertType}，建议通知巡逻人员前往核实。`;
                    setAllAlerts(prev => prev.map(a => a.id === alertData.id ? { ...a, remark: fakeMsg } : a));
                    setDisplayedAlerts(prev => prev.map(a => a.id === alertData.id ? { ...a, remark: fakeMsg } : a));
                } finally {
                    setAiLoadingIds(prev => ({ ...prev, [alertData.id]: false }));
                }
            };

            // --- 会话管理逻辑 ---
            const handleSendMessage = async () => {
                if (!chatInput.trim() || isChatLoading) return;
                
                const userText = chatInput.trim();
                const newUserMsg = { role: 'user', text: userText };
                
                setChatMessages(prev => [...prev, newUserMsg]);
                setChatInput('');
                setIsChatLoading(true);

                try {
                    const apiKey = ""; // 填入您的 API Key
                    const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`;
                    
                    const contents = [...chatMessages, newUserMsg].map(msg => ({
                        role: msg.role === 'model' ? 'model' : 'user',
                        parts: [{ text: msg.text }]
                    }));

                    const response = await fetch(url, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ contents })
                    });
                    
                    if (!response.ok) throw new Error('API Request Failed');
                    
                    const data = await response.json();
                    const aiText = data.candidates?.[0]?.content?.parts?.[0]?.text || "抱歉，我目前无法回答这个问题。";
                    setChatMessages(prev => [...prev, { role: 'model', text: aiText }]);
                } catch (error) {
                    console.error(error);
                    // 模拟本地回复
                    setTimeout(() => {
                         setChatMessages(prev => [...prev, { role: 'model', text: "（离线模拟回复）您说的我已记录。如果是关于设备接入，请确保IP和端口正确配置。如需进一步帮助，请提供更多细节。" }]);
                         setIsChatLoading(false);
                    }, 1500);
                    return; // 提前退出因为 setTimeout 处理了状态
                } 
                
                setIsChatLoading(false);
            };

            // --- 设备管理逻辑 ---
            const indexOfLastDevice = devicePage * itemsPerPage;
            const indexOfFirstDevice = indexOfLastDevice - itemsPerPage;
            const currentDevices = devices.slice(indexOfFirstDevice, indexOfLastDevice);
            const totalDevicePages = Math.ceil(devices.length / itemsPerPage);

            const openDeviceModal = (device = null) => {
                if (device) {
                    setDeviceFormData(device);
                    setEditingDeviceId(device.id);
                } else {
                    setDeviceFormData({ name: '', ip: '', port: '', username: '', password: '' });
                    setEditingDeviceId(null);
                }
                setIsDeviceModalOpen(true);
            };

            const handleDeviceSave = () => {
                if (!deviceFormData.name || !deviceFormData.ip) return alert('名称和IP不能为空！');
                if (editingDeviceId) {
                    setDevices(prev => prev.map(d => d.id === editingDeviceId ? { ...d, ...deviceFormData } : d));
                } else {
                    setDevices(prev => [{ id: `dev-${Date.now()}`, ...deviceFormData, status: '离线' }, ...prev]);
                    setDevicePage(1);
                }
                setIsDeviceModalOpen(false);
            };

            const handleDeviceDelete = (id) => {
                if (window.confirm('确定删除该设备吗？')) {
                    const updated = devices.filter(d => d.id !== id);
                    setDevices(updated);
                    if (updated.length <= (devicePage - 1) * itemsPerPage && devicePage > 1) setDevicePage(devicePage - 1);
                }
            };

            const getAlertStyle = (type) => {
                switch (type) {
                    case '烟火检测':
                    case '区域入侵': return 'bg-red-100 text-red-700';
                    case '越界检测': return 'bg-orange-100 text-orange-700';
                    default: return 'bg-yellow-100 text-yellow-700';
                }
            };

            const getStatusStyle = (status) => {
                switch (status) {
                    case '在线': return 'bg-green-100 text-green-700 border-green-200';
                    case '异常': return 'bg-red-100 text-red-700 border-red-200';
                    case '离线': default: return 'bg-gray-100 text-gray-700 border-gray-200';
                }
            };

            return (
                <div className="flex h-screen bg-gray-100 text-gray-800 font-sans">
                    {/* 左侧菜单 */}
                    <aside className="w-64 bg-slate-900 text-slate-300 flex flex-col shadow-xl z-20 shrink-0">
                        <div className="h-16 flex items-center px-6 border-b border-slate-800">
                            <Icon name="Activity" className="w-6 h-6 text-blue-500 mr-3" />
                            <h1 className="text-lg font-bold text-white tracking-wider">综合管理平台</h1>
                        </div>
                        <nav className="flex-1 py-6 px-3 space-y-2">
                            {[

                        <div className="fixed inset-0 z-50 flex items-center justify-center bg-black bg-opacity-40 backdrop-blur-sm">
                            <div className="bg-white rounded-xl shadow-2xl w-full max-w-md">
                                <div className="px-6 py-4 border-b flex justify-between items-center">
                                    <h3 className="text-lg font-semibold">{editingDeviceId ? '编辑设备' : '添加设备'}</h3>
                                    <button onClick={() => setIsDeviceModalOpen(false)} className="text-gray-400 hover:text-gray-600"><Icon name="X" className="w-5 h-5" /></button>
                                </div>
                                <div className="px-6 py-5 space-y-4">
                                    <input type="text" placeholder="设备名称 *" value={deviceFormData.name} onChange={e => setDeviceFormData({...deviceFormData, name: e.target.value})} className="w-full px-4 py-2 border rounded-lg outline-none" />
                                    <div className="flex space-x-4">
                                        <input type="text" placeholder="IP 地址 *" value={deviceFormData.ip} onChange={e => setDeviceFormData({...deviceFormData, ip: e.target.value})} className="w-full px-4 py-2 border rounded-lg flex-1 outline-none" />
                                        <input type="text" placeholder="端口" value={deviceFormData.port} onChange={e => setDeviceFormData({...deviceFormData, port: e.target.value})} className="w-full px-4 py-2 border rounded-lg w-32 outline-none" />
                                    </div>
                                    <input type="text" placeholder="用户名" value={deviceFormData.username} onChange={e => setDeviceFormData({...deviceFormData, username: e.target.value})} className="w-full px-4 py-2 border rounded-lg outline-none" />
                                    <input type="password" placeholder="密码" value={deviceFormData.password} onChange={e => setDeviceFormData({...deviceFormData, password: e.target.value})} className="w-full px-4 py-2 border rounded-lg outline-none" />
                                </div>
                                <div className="px-6 py-4 border-t flex justify-end space-x-3 bg-gray-50">
                                    <button onClick={() => setIsDeviceModalOpen(false)} className="px-4 py-2 border rounded-lg">取消</button>
                                    <button onClick={handleDeviceSave} className="px-4 py-2 bg-blue-600 text-white rounded-lg">确定</button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
